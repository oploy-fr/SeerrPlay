name: Publish store builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Store platform to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - apple

permissions:
  contents: read

concurrency:
  group: store-publish
  cancel-in-progress: false

jobs:
  android:
    name: Google Play internal testing
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-latest
    environment: store-publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' apps/seerrplay/pubspec.yaml)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish Android internal build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android internal build_number:"$GITHUB_RUN_NUMBER"

  apple:
    name: App Store Connect and TestFlight
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'apple'
    runs-on: macos-15
    environment: store-publishing
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' apps/seerrplay/pubspec.yaml)
          test "$GITHUB_REF_NAME" = "v$version"
          grep -q "MARKETING_VERSION = $version;" \
            apps/seerrplay_tvos/SeerrPlayTV.xcodeproj/project.pbxproj
      - name: Configure match repository access
        env:
          MATCH_GIT_PRIVATE_KEY_CONTENT: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          test -n "$MATCH_GIT_PRIVATE_KEY_CONTENT"
          key_path="$RUNNER_TEMP/seerrplay-match-deploy-key"
          printf '%s\n' "$MATCH_GIT_PRIVATE_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          printf 'MATCH_GIT_PRIVATE_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"
      - name: Publish iOS and tvOS TestFlight builds
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane apple_beta build_number:"$GITHUB_RUN_NUMBER"
