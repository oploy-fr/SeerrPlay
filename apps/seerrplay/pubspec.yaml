name: seerrplay
description: Unified Seerr, Plex, Jellyfin, and Emby discovery, requests, and playback client.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.10.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^22.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  uuid: ^4.6.0
  video_player: ^2.10.1
  video_player_pip:
    path: packages/video_player_pip
  workmanager: ^0.9.0+3
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/branding/
    - assets/credits/tmdb_logo.svg
