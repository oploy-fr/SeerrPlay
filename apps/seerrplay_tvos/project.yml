name: SeerrPlayTV
options:
  bundleIdPrefix: app.seerrplay
  deploymentTarget:
    tvOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: T494GRAXS3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SeerrPlayTV:
    type: application
    platform: tvOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - Branding
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.seerrplay.client
        PRODUCT_NAME: SeerrPlay
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SeerrPlay
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: SeerrPlay connects directly to the Seerr and personal media servers you configure.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: 3
    scheme:
      gatherCoverageData: false
